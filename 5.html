<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .card {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .success {
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
        }
    </style>
</head>

<body>

    <h2>API Dashboard</h2>
    <div id="summary"></div>
    <div id="results"></div>
    <button id="retryBtn">Retry Failed</button>

    <script>
        const URLS = [
            "https://jsonplaceholder.typicode.com/users/1",
            "https://jsonplaceholder.typicode.com/posts?userId=1",
            "https://jsonplaceholder.typicode.com/nonexistent", // 404
            "https://jsonplaceholder.typicode.com/todos?userId=1"
        ];

        let failedUrls = [];

        async function fetchAll(urls) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            failedUrls = [];

            const results = await Promise.allSettled(
                urls.map(url =>
                    fetch(url).then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.json();
                    })
                )
            );

            let successCount = 0;
            let failCount = 0;

            results.forEach((result, i) => {
                const url = urls[i];

                if (result.status === "fulfilled") {
                    successCount++;
                    renderSuccess(result.value, url);
                } else {
                    failCount++;
                    failedUrls.push(url);
                    renderError(result.reason.message, url);
                }
            });

            renderSummary(successCount, failCount);
        }

        function renderSuccess(data, url) {
            const div = document.createElement("div");
            div.className = "card success";
            div.innerHTML = ` SUCCESS<br><b>${url}</b><br><pre>${JSON.stringify(data).slice(0, 100)}...</pre>`;
            document.getElementById("results").appendChild(div);
        }

        function renderError(error, url) {
            const div = document.createElement("div");
            div.className = "card error";
            div.innerHTML = ` ERROR<br><b>${url}</b><br>${error}`;
            document.getElementById("results").appendChild(div);
        }

        function renderSummary(success, fail) {
            document.getElementById("summary").innerHTML =
                `${success + fail} requests · ${success} succeeded · ${fail} failed`;
        }

        document.getElementById("retryBtn").onclick = () => {
            if (failedUrls.length === 0) {
                alert("No failed requests!");
                return;
            }
            fetchAll(failedUrls);
        };

        fetchAll(URLS);

    </script>

</body>

</html>
